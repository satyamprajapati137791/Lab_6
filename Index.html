<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bouncing Loader</title>
<style>
body {
    margin: 0;
    padding: 0;
    background-color: #34495e;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}
.loader {
    display: flex;
    gap: 12px;
}
.circle {
    width: 16px;
    height: 16px;
    background-color: #fff;
    border-radius: 50%;
    animation: bounce 0.5s infinite alternate;
}
.circle:nth-child(2) {
    animation-delay: 0.2s;
}
.circle:nth-child(3) {
    animation-delay: 0.4s;
}
@keyframes bounce {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(-20px);
    }
}
</style>
</head>
<body>
<div class="loader">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
</div>
</body>
</html>
